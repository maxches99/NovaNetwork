name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-site:
    name: Documentation Website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: DocumentationSite

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: DocumentationSite/pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build

      - name: Verify rendered documentation routes
        run: pnpm test

  linux-core-swift-6-2:
    name: Linux Core (Swift 6.2.3)
    runs-on: ubuntu-latest
    container: swift:6.2.3-noble
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Swift 6.2
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          swift --version | grep -Eq 'Swift version 6\.2\.3([.[:space:]]|$)'

      - name: Build Cross-Platform Core
        run: swift build --target NovaNetworkCore -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency

  swift-6-3-compatibility:
    name: Swift 6.3 Compatibility
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.3 SDK
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Latest Swift 6.3 Toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg "${RUNNER_TEMP}/swiftly.pkg" -target CurrentUserHomeDirectory
          "${HOME}/.swiftly/bin/swiftly" init \
            --skip-install \
            --no-modify-profile \
            --quiet-shell-followup \
            --assume-yes
          "${HOME}/.swiftly/bin/swiftly" install --use 6.3 --assume-yes
          echo "${HOME}/.swiftly/bin" >> "${GITHUB_PATH}"

      - name: Verify Swift 6.3
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(swift --version)
          echo "${VERSION}"
          grep -Eq 'Swift version 6\.3([.[:space:]]|$)' <<< "${VERSION}"

      - name: Build with Complete Concurrency Checking
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency

      - name: Test
        run: swift test

  build-test-coverage:
    name: Build, Test, Coverage Gates
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Verify Swift 6.2
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(swift --version)
          echo "${VERSION}"
          grep -Eq 'Swift version 6\.2([.[:space:]]|$)' <<< "${VERSION}"

      - name: Build
        run: swift build

      - name: Unit Tests with Coverage
        run: swift test --enable-code-coverage

      - name: Enforce Unit Coverage >= 90%
        shell: bash
        run: |
          set -euo pipefail

          TEST_BIN=$(find .build -type f -path "*NovaNetworkClientPackageTests.xctest/Contents/MacOS/NovaNetworkClientPackageTests" | head -n 1)
          PROF_DATA=$(find .build -type f -path "*/debug/codecov/default.profdata" | head -n 1)

          if [[ -z "${TEST_BIN}" || -z "${PROF_DATA}" ]]; then
            echo "Failed to locate coverage artifacts for unit tests."
            exit 1
          fi

          # Two files are excluded, each for a reason a unit test cannot work around:
          # NetworkDiagnosticsView is a SwiftUI view, never executed by tests, whose logic lives in
          # the covered DiagnosticsPanelState; KeychainTokenStore's read and write paths need a real
          # Keychain, which a headless CI process cannot use reliably.
          SOURCE_FILES=$(find \
            Sources/NovaNetworkClient \
            Sources/NovaNetworkCore \
            Sources/NovaNetworkOpenAPI \
            Sources/NovaNetworkCassette \
            Sources/NovaNetworkDiagnostics \
            Sources/NovaNetworkAuth \
            Sources/NovaNetworkQuery \
            -name "*.swift" \
            ! -name "NetworkDiagnosticsView.swift" \
            ! -name "KeychainTokenStore.swift" -print)
          REPORT=$(xcrun llvm-cov report "${TEST_BIN}" \
            -instr-profile="${PROF_DATA}" \
            ${SOURCE_FILES})

          echo "${REPORT}"

          UNIT_COVERAGE=$(echo "${REPORT}" | awk '
            /^TOTAL/ {
              p = 0
              for (i = 1; i <= NF; i++) {
                if ($i ~ /%$/) {
                  p++
                  if (p == 3) {
                    gsub("%", "", $i)
                    print $i
                    exit
                  }
                }
              }
            }
          ')
          if [[ -z "${UNIT_COVERAGE}" ]]; then
            echo "Failed to parse unit coverage."
            exit 1
          fi

          awk -v cov="${UNIT_COVERAGE}" 'BEGIN { if (cov + 0 < 90) exit 1 }' || {
            echo "Unit coverage gate failed: ${UNIT_COVERAGE}% < 90%"
            exit 1
          }
          echo "Unit coverage gate passed: ${UNIT_COVERAGE}% >= 90%"

      - name: E2E Tests with Coverage
        env:
          RUN_E2E_TESTS: "1"
        run: swift test --enable-code-coverage --filter E2ECoverageTests

      - name: Enforce E2E Public API Rule (No Mocks/Stubs)
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "E2EMock|E2EAlways|MockTransport|StubNetworkTransport|ScriptedNetworkTransport|https://example\\.com|wss://example\\.com" Tests/NovaNetworkClientTests/E2E; then
            echo "E2E policy violation: only real public APIs are allowed; mocks/stubs/fake endpoints are forbidden."
            exit 1
          fi

  linux-client-build-gate:
    # Compile-only gate: NovaNetworkClient and NovaNetworkClientTestSupport have never had a
    # Linux CI run before this job. This intentionally does not run swift test on Linux yet --
    # only confirms the packages still compile against swift-corelibs-foundation, catching
    # regressions like an unguarded Apple-only import (CryptoKit, Security) before they land.
    name: Linux Client Build Gate (Swift 6.2.3)
    runs-on: ubuntu-latest
    container: swift:6.2.3-noble
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Swift 6.2
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          swift --version | grep -Eq 'Swift version 6\.2\.3([.[:space:]]|$)'

      - name: Build the Client, Test Support, and Feature Targets
        run: |
          swift build \
            --target NovaNetworkClient \
            --target NovaNetworkClientTestSupport \
            --target NovaNetworkOpenAPI \
            --target NovaNetworkCassette \
            --target NovaNetworkDiagnostics \
            --target NovaNetworkAuth \
            --target NovaNetworkQuery

  endpoint-macros-trait:
    # The @Endpoint macro lives behind the EndpointMacros package trait, so the default build never
    # compiles it. Without this job the macro and its tests would rot unnoticed. The first step also
    # holds the line on the trait's whole point: with it disabled, the package resolves nothing.
    name: Endpoint Macros Trait (Swift 6.2)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Verify the Default Package Graph Has No Dependencies
        shell: bash
        run: |
          set -euo pipefail
          DEPENDENCIES=$(swift package show-dependencies --format flatlist)
          if [[ -n "${DEPENDENCIES}" ]]; then
            echo "The default package graph must resolve zero dependencies, but resolved:"
            echo "${DEPENDENCIES}"
            exit 1
          fi
          echo "Default package graph resolves no dependencies."

      - name: Build with the Trait Enabled
        run: swift build --traits EndpointMacros -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency

      - name: Test with the Trait Enabled
        run: swift test --traits EndpointMacros

  openapi-generator:
    # Generated code is checked in, so the generator has to stay honest about two things: the same
    # spec always produces the same bytes, and the file in the repository is what today's generator
    # emits. Both fail here as a diff rather than as a surprise in someone's pull request.
    name: OpenAPI Generator Determinism
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Regenerate the Petstore Example
        run: |
          swift run nova-openapi \
            --spec Examples/OpenAPIPetstore/petstore.yaml \
            --output Examples/OpenAPIPetstore/Generated/GeneratedPetstoreAPI.swift

      - name: Fail If the Checked-In Output Is Stale
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- Examples/OpenAPIPetstore/Generated/GeneratedPetstoreAPI.swift; then
            echo "Generated endpoints are stale. Regenerate them with the command above and commit the result."
            exit 1
          fi
          echo "Checked-in generated endpoints match the generator's current output."

  api-breaking-changes-gate:
    # Compares public API against the most recently tagged release (3.4.0). Known, deliberate,
    # source-compatible differences are allowlisted in docs/api-breakage-allowlist.txt -- see
    # that file and CONTRIBUTING.md#api-compatibility for what's there and why. Once a new tag
    # is cut, update `treeish` below to the new tag and clear entries from the allowlist that
    # the new baseline already reflects.
    #
    # The 3.4.0 baseline widens this gate considerably: 2.0.0 predates six of the nine products,
    # so they were never compared against anything. All nine are now.
    name: API Breaking Changes Gate (vs 3.4.0)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Diagnose API-Breaking Changes Against 3.4.0
        run: |
          swift package diagnose-api-breaking-changes 3.4.0 \
            --breakage-allowlist-path docs/api-breakage-allowlist.txt

  demo-app-ui-tests:
    # `NetworkDiagnosticsView` is excluded from the coverage gate because whether a list row is
    # tappable is a property of the rendered view hierarchy, not of the state behind it -- and that
    # is exactly the bug that once shipped. The demo app's UI tests are the gate for it. They run
    # entirely offline; the app's scripted backend is the default.
    name: Demo App UI Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Pick the Newest Available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          # Runtimes are listed oldest first, so the last iPhone line belongs to the newest one.
          UDID=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | tail -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
          if [[ -z "${UDID}" ]]; then
            echo "No iPhone simulator is available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
          echo "Using simulator ${UDID}."

      - name: Boot the Simulator
        # Letting xcodebuild boot it lazily is where most of the launch failures came from. Booting
        # first, and waiting for the device to actually be ready, removes that race from the test
        # run itself.
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run the Demo App's UI Tests
        # Retried once, and only once, because what is being retried is not a test failure: the
        # runner intermittently cannot start the app at all, which took out unrelated pull requests
        # all evening. A gate that fails at random teaches a team to ignore it.
        #
        # It shows up in two shapes, and only one of them is a failure. Sometimes the launch fails
        # outright ("Failed to get launch", a failure to deliver a signal to the app process), and
        # xcodebuild exits non-zero. Sometimes it simply never returns, and a retry loop alone would
        # sit behind it until the job timeout with no second attempt ever made. Hence the per-attempt
        # deadline: two attempts of twelve minutes each fit inside this job's thirty.
        #
        # An assertion failure is deterministic and fails both attempts, so none of this hides one --
        # it costs a second run of an already-failing suite and nothing else.
        shell: bash
        env:
          ATTEMPT_TIMEOUT_SECONDS: "720"
        run: |
          set -uo pipefail

          run_attempt() {
            xcodebuild test \
              -project DemoApp/NovaDiagnosticsDemo.xcodeproj \
              -scheme NovaDiagnosticsDemo \
              -destination "id=${{ steps.simulator.outputs.udid }}" &
            local pid=$!
            local waited=0
            while kill -0 "${pid}" 2>/dev/null; do
              if (( waited >= ATTEMPT_TIMEOUT_SECONDS )); then
                echo "No result after ${ATTEMPT_TIMEOUT_SECONDS}s; treating this attempt as hung."
                kill -9 "${pid}" 2>/dev/null || true
                wait "${pid}" 2>/dev/null || true
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "${pid}"
          }

          for attempt in 1 2; do
            echo "::group::UI tests, attempt ${attempt}"
            run_attempt && status=0 || status=$?
            echo "::endgroup::"
            if [[ ${status} -eq 0 ]]; then
              exit 0
            fi
            echo "Attempt ${attempt} failed with status ${status}."
            if [[ ${attempt} -eq 1 ]]; then
              xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
              xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
              xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b || true
            fi
          done
          exit 1

  macos-inspector:
    # The inspector is thin on purpose -- a model that opens a file into a recorder, and the
    # package's own panel for everything else -- but it is the only consumer of `HARImporter` and
    # `DiagnosticsRecorder.load(_:)` outside the tests, so a build here catches an API change that
    # unit tests would not.
    name: macOS Inspector Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build the Inspector
        run: |
          xcodebuild build \
            -project Inspector/NovaNetworkInspector.xcodeproj \
            -scheme NovaNetworkInspector \
            -destination 'platform=macOS'

  benchmark-baselines:
    # The benchmark executable existed and nothing ran it, so a regression in how many transport
    # calls a coalesced workload makes would have landed without anyone noticing.
    #
    # What is enforced here is only what the code decides: transport-call counts, retry-storm
    # outcomes, breaker transitions, replay counts. Those hold on any machine. Elapsed time, p95/p99
    # latency, and allocation deltas are as much a property of a shared runner as of the code, so
    # they are printed and advised rather than enforced -- a budget that fails because a neighbouring
    # job was busy teaches a team to ignore the gate. Pass `--strict-timing` on dedicated hardware to
    # enforce those too.
    name: Benchmark Baselines
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build the Benchmarks
        run: swift build -c release --product NovaNetworkClientBenchmarks

      - name: Check the Request Baseline
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --product NovaNetworkClientBenchmarks --show-bin-path)/NovaNetworkClientBenchmarks"
          OUTPUT=$("${BIN}" --check-baseline 2>&1 | tee /dev/stderr)
          # The marker is asserted as well as the exit code, so a future early return cannot pass
          # by printing nothing.
          grep -Eq '^baseline_check=(passed|passed_with_advisory)$' <<< "${OUTPUT}"

      - name: Check the Stress Baseline
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --product NovaNetworkClientBenchmarks --show-bin-path)/NovaNetworkClientBenchmarks"
          OUTPUT=$("${BIN}" --check-stress-baseline 2>&1 | tee /dev/stderr)
          grep -Eq '^stress_baseline_check=(passed|passed_with_advisory)$' <<< "${OUTPUT}"
