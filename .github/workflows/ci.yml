name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-6-3-compatibility:
    name: Swift 6.3 Compatibility
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.3 SDK
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Latest Swift 6.3 Toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg "${RUNNER_TEMP}/swiftly.pkg" -target CurrentUserHomeDirectory
          "${HOME}/.swiftly/bin/swiftly" init \
            --skip-install \
            --no-modify-profile \
            --quiet-shell-followup \
            --assume-yes
          "${HOME}/.swiftly/bin/swiftly" install --use 6.3 --assume-yes
          echo "${HOME}/.swiftly/bin" >> "${GITHUB_PATH}"

      - name: Verify Swift 6.3
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(swift --version)
          echo "${VERSION}"
          grep -Eq 'Swift version 6\.3([.[:space:]]|$)' <<< "${VERSION}"

      - name: Build with Complete Concurrency Checking
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency

      - name: Test
        run: swift test

  build-test-coverage:
    name: Build, Test, Coverage Gates
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.2 (Swift 6.2)
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Verify Swift 6.2
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(swift --version)
          echo "${VERSION}"
          grep -Eq 'Swift version 6\.2([.[:space:]]|$)' <<< "${VERSION}"

      - name: Build
        run: swift build

      - name: Unit Tests with Coverage
        run: swift test --enable-code-coverage

      - name: Enforce Unit Coverage >= 90%
        shell: bash
        run: |
          set -euo pipefail

          TEST_BIN=$(find .build -type f -path "*NovaNetworkClientPackageTests.xctest/Contents/MacOS/NovaNetworkClientPackageTests" | head -n 1)
          PROF_DATA=$(find .build -type f -path "*/debug/codecov/default.profdata" | head -n 1)

          if [[ -z "${TEST_BIN}" || -z "${PROF_DATA}" ]]; then
            echo "Failed to locate coverage artifacts for unit tests."
            exit 1
          fi

          SOURCE_FILES=$(find Sources/NovaNetworkClient Sources/NovaNetworkCore -name "*.swift" -print)
          REPORT=$(xcrun llvm-cov report "${TEST_BIN}" \
            -instr-profile="${PROF_DATA}" \
            ${SOURCE_FILES})

          echo "${REPORT}"

          UNIT_COVERAGE=$(echo "${REPORT}" | awk '
            /^TOTAL/ {
              p = 0
              for (i = 1; i <= NF; i++) {
                if ($i ~ /%$/) {
                  p++
                  if (p == 3) {
                    gsub("%", "", $i)
                    print $i
                    exit
                  }
                }
              }
            }
          ')
          if [[ -z "${UNIT_COVERAGE}" ]]; then
            echo "Failed to parse unit coverage."
            exit 1
          fi

          awk -v cov="${UNIT_COVERAGE}" 'BEGIN { if (cov + 0 < 90) exit 1 }' || {
            echo "Unit coverage gate failed: ${UNIT_COVERAGE}% < 90%"
            exit 1
          }
          echo "Unit coverage gate passed: ${UNIT_COVERAGE}% >= 90%"

      - name: E2E Tests with Coverage
        env:
          RUN_E2E_TESTS: "1"
        run: swift test --enable-code-coverage --filter E2ECoverageTests

      - name: Enforce E2E Public API Rule (No Mocks/Stubs)
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "E2EMock|E2EAlways|MockTransport|StubNetworkTransport|ScriptedNetworkTransport|https://example\\.com|wss://example\\.com" Tests/NovaNetworkClientTests/E2E; then
            echo "E2E policy violation: only real public APIs are allowed; mocks/stubs/fake endpoints are forbidden."
            exit 1
          fi
