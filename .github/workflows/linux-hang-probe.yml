name: Linux Hang Probe

# Temporary, and it answers exactly one question: what is the Linux test process
# blocked on inside transportTaskCancellationMayMapToCancelled(). Delete this
# file and .github/scripts/linux-hang-probe.sh once that is answered.
#
# The first round of this probe narrowed the whole-suite stall to that one test
# and showed it stalls the same way when the suite runs alone, so this round
# runs nothing else.

on:
  workflow_dispatch:
  push:
    branches:
      - linux-tests

concurrency:
  group: linux-hang-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-of-the-stall:
    name: Stack of the Stall (Swift 6.2.3)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.3-noble
      # The default container blocks ptrace, which is why the first round came
      # back with "Could not attach to process" instead of a backtrace.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gdb
        run: apt-get update && apt-get install -y --no-install-recommends gdb

      - name: The one test, watched
        env:
          SILENCE_LIMIT: "60"
          LOG_FILE: probe-one.log
        run: ./.github/scripts/linux-hang-probe.sh --filter transportTaskCancellationMayMapToCancelled

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-one-logs
          path: |
            probe-one.log
            gdb-*.txt
