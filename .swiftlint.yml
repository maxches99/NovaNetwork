# SwiftLint configuration. Not wired into `swift build`/CI as an SPM plugin -- this project
# avoids adding dependencies unless there's a clear need. Run manually or add as an opt-in CI
# step once installed: `brew install swiftlint && swiftlint`. Not yet run against this codebase
# (no SwiftLint binary is available in the environment this file was authored in) -- expect the
# first real run to surface findings that need triage, not a clean pass.

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - Benchmarks

# Line length: several files use long, descriptive parameter lists and doc comments; this
# project's existing style already runs past the default 120-column limit in places.
line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900

cyclomatic_complexity:
  warning: 20
  error: 30

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - to

# Disabled: this codebase's DocC comments and multi-clause guard/switch statements over
# NetworkError's cases read better without these specific style rules enforced.
disabled_rules:
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

# Test targets legitimately force-unwrap fixture URLs/data constantly; keep the rule for
# Sources only.
force_unwrapping:
  severity: warning
